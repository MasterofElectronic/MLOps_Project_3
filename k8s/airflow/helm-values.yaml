# Executor
executor: LocalExecutor

images:
  airflow:
    repository: apache/airflow
    tag: 2.9.1

# Sin imagen personalizada — usamos la oficial de Airflow 2.9.1 stable
extraPipPackages:
  - "apache-airflow-providers-postgres==5.10.0"
  - "psycopg2-binary==2.9.9"
  - "mlflow==2.22.0"
  - "scikit-learn==1.4.2"
  - "xgboost==2.0.3"
  - "pandas==2.2.2"
  - "numpy==1.26.4"
  - "boto3==1.34.0"
  - "sqlalchemy==1.4.52"


# Base de datos externa (nuestro PostgreSQL)
data:
  metadataConnection:
    user: mlops
    pass: mlops2026
    host: postgres-svc.ingesta.svc.cluster.local
    port: 5432
    db: airflow_metadata
    protocol: postgresql

# Deshabilitar PostgreSQL y Redis incluidos en el chart
postgresql:
  enabled: false
redis:
  enabled: false

# Fernet key
fernetKey: ""  # se genera automáticamente

# Webserver
webserver:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  service:
    type: NodePort

# Scheduler
scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 3Gi

# DAGs — desde el PVC existente
dags:
  persistence:
    enabled: true
    storageClassName: hostpath
    size: 2Gi
    accessMode: ReadWriteOnce

# Logs
logs:
  persistence:
    enabled: false

# Variables de entorno globales
env:
  - name: MLFLOW_TRACKING_URI
    value: "http://mlflow-svc.mlflow.svc.cluster.local:5000"
  - name: MLFLOW_S3_ENDPOINT_URL
    value: "http://minio-svc.ingesta.svc.cluster.local:9000"
  - name: AWS_ACCESS_KEY_ID
    value: "minioadmin"
  - name: AWS_SECRET_ACCESS_KEY
    value: "minioadmin2026"

# Usuario admin
webserverSecretKey: "mlops2026javeriana"

defaultAirflowUsername: admin
defaultAirflowPassword: admin2026

# Deshabilitar ejemplos
config:
  core:
    load_examples: "false"
    dags_are_paused_at_creation: "false"
  scheduler:
    dag_dir_list_interval: "30"