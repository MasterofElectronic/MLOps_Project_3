apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.24.0
          args:
            - -f
            - /locust/locustfile.py
            - --host=http://diabetes-api-svc:8000
            - --web-port=8089
          ports:
            - containerPort: 8089
          volumeMounts:
            - name: locustfile
              mountPath: /locust
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: locustfile
          configMap:
            name: locust-config
---
apiVersion: v1
kind: Service
metadata:
  name: locust-svc
  namespace: inference
spec:
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: 30089
  type: NodePort
